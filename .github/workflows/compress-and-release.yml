name: Compress Artifacts and Release

on:
  push:
    tags: 'v*.*.*'

jobs:
  compress-and-release:
    name: Compress Artifacts and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run `compress-all.sh` in root folder
        run: chmod +x ./compress-all.sh && ./compress-all.sh
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: ./*.tar.gz